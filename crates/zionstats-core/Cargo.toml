[package]
name = "zionstats-core"
description = "Shared types, SHM layout, hysteresis controller, sources, metrics for zionstats"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
zerocopy.workspace = true
memmap2.workspace = true
nvml-wrapper = { workspace = true, optional = true }
nvml-wrapper-sys = { workspace = true, optional = true }
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
ureq.workspace = true
aes.workspace = true
ecb.workspace = true
aes-gcm = { workspace = true, features = ["getrandom"] }
base64.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "shm"
harness = false

[[bench]]
name = "controller"
harness = false

[features]
default = ["nvml"]
nvml = ["dep:nvml-wrapper", "dep:nvml-wrapper-sys"]
