[package]
name = "zionstats"
description = "Unified CLI: terminal UI by default, --daemon for the headless daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "zionstats"
path = "src/main.rs"

[dependencies]
zionstats-core = { workspace = true, features = ["nvml"] }
zionstats-daemon = { workspace = true, features = ["nvml"] }
zionstats-tui.workspace = true
clap.workspace = true
clap_complete.workspace = true
log.workspace = true
env_logger.workspace = true
libc.workspace = true
