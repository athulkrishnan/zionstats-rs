name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag must match workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WS_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$TAG_VERSION workspace=$WS_VERSION"
          [ "$TAG_VERSION" = "$WS_VERSION" ] || { echo "::error::tag v$TAG_VERSION != workspace $WS_VERSION"; exit 1; }

  binaries:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, name: linux_amd64 }
          - { target: aarch64-unknown-linux-musl, name: linux_arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build static binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --workspace
      - name: Smoke (x86_64 only -- an aarch64 binary cannot exec on this runner)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ./target/${{ matrix.target }}/release/zionstatsd --version
          ./target/${{ matrix.target }}/release/zionstats-tui --version
      - name: Zip
        shell: python
        run: |
          import os, zipfile
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          name = "${{ matrix.name }}"
          target = os.environ["matrix_target"]
          zpath = f"zionstats_{version}_{name}.zip"
          with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
              for b in ("zionstats", "zionstatsd", "zionstats-tui"):
                  z.write(f"target/{target}/release/{b}", b)
              for f in ("README.md", "LICENSE", "NOTICE", "CHANGELOG.md"):
                  z.write(f, f)
              for m in ("zionstats.1", "zionstatsd.1", "zionstats-tui.1"):
                  z.write(f"docs/man/{m}", f"man/{m}")
        env:
          matrix_target: ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.name }}
          path: zionstats_*.zip

  publish:
    needs: [binaries, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Checksums + release
        run: |
          mkdir -p release
          find artifacts -type f | while read f; do cp "$f" release/; done
          cd release && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.zip
            release/checksums.txt
          body: |
            Static musl binaries. Needs the NVIDIA driver for live metrics;
            `zionstats --demo` works anywhere. See CHANGELOG.md.
