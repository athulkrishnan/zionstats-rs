# cargo-deny: keep the dependency tree license-compatible with Apache-2.0.
[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
]

[bans]
multiple-versions = "warn"

[advisories]
version = 2
yanked = "warn"
# paste <- ratatui 0.29 (RUSTSEC-2024-0436): no advisory fix available;
# re-evaluate on the next ratatui release
ignore = ["RUSTSEC-2024-0436"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
